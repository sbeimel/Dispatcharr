# Unraid Single Container Optimization Configuration
# This file contains the optimized settings for running Dispatcharr in a single container on Unraid
# Copy these settings to your Unraid container configuration

# =============================================================================
# DISPATCHARR MAIN CONTAINER CONFIGURATION FOR UNRAID
# =============================================================================

# Repository: ghcr.io/dispatcharr/dispatcharr:latest
# Container Name: dispatcharr (or your preferred name)
# Network Type: bridge (or custom network)

# =============================================================================
# ENVIRONMENT VARIABLES (Add these to your Unraid container)
# =============================================================================

# Core Dispatcharr Settings
POSTGRES_HOST=your-postgres-container-name-or-ip
POSTGRES_DB=dispatcharr
POSTGRES_USER=dispatch
POSTGRES_PASSWORD=secret
REDIS_HOST=your-redis-container-name-or-ip
CELERY_BROKER_URL=redis://your-redis-container-name-or-ip:6379/0
DISPATCHARR_LOG_LEVEL=info

# Performance Optimizations - uWSGI Web Server
UWSGI_PROCESSES=4                    # Number of CPU cores (adjust based on your system)
UWSGI_THREADS=2                      # Threads per process
UWSGI_BUFFER_SIZE=65536              # 64KB buffer size
UWSGI_MAX_REQUESTS=1000              # Restart worker after X requests (prevents memory leaks)
UWSGI_HARAKIRI=300                   # Kill requests after 5 minutes (prevents hanging)
UWSGI_SINGLE_INTERPRETER=1           # Python optimization
UWSGI_NICE_LEVEL=-5                  # High priority for streaming operations
CELERY_NICE_LEVEL=5                  # Lower priority for background tasks

# Memory and Performance Settings
CELERY_WORKER_CONCURRENCY=4          # Number of Celery workers (adjust based on CPU cores)
CELERY_WORKER_PREFETCH_MULTIPLIER=2  # Tasks to prefetch per worker

# =============================================================================
# CONTAINER SETTINGS
# =============================================================================

# Memory Limit: 4GB (recommended for single container setup)
# CPU Limit: 4 cores (adjust based on your system)

# =============================================================================
# VOLUMES (Same as your current setup)
# =============================================================================
# /path/to/your/data:/data
# /path/to/your/config:/config (if applicable)

# =============================================================================
# PORTS (Same as your current setup)
# =============================================================================
# 9191:9191 (or your preferred port mapping)

# =============================================================================
# EXTRA PARAMETERS (Optional - for advanced users)
# =============================================================================
# Add these to "Extra Parameters" field in Unraid if you want additional optimizations:

# --tmpfs /tmp:rw,noexec,nosuid,size=256m
# --cap-add=SYS_NICE
# --sysctl net.ipv4.tcp_keepalive_time=600
# --sysctl net.ipv4.tcp_keepalive_intvl=60
# --sysctl net.ipv4.tcp_keepalive_probes=3

# =============================================================================
# POSTGRESQL OPTIMIZATION (If you run PostgreSQL in separate container)
# =============================================================================

# Add these environment variables to your PostgreSQL container:
# POSTGRES_SHARED_BUFFERS=256MB
# POSTGRES_EFFECTIVE_CACHE_SIZE=1GB
# POSTGRES_WORK_MEM=16MB
# POSTGRES_MAINTENANCE_WORK_MEM=64MB
# POSTGRES_MAX_CONNECTIONS=200
# POSTGRES_CHECKPOINT_COMPLETION_TARGET=0.9
# POSTGRES_WAL_BUFFERS=16MB
# POSTGRES_RANDOM_PAGE_COST=1.1
# POSTGRES_EFFECTIVE_IO_CONCURRENCY=200

# Or add to PostgreSQL command:
# postgres -c shared_buffers=256MB -c effective_cache_size=1GB -c work_mem=16MB -c maintenance_work_mem=64MB -c max_connections=200 -c checkpoint_completion_target=0.9 -c wal_buffers=16MB -c random_page_cost=1.1 -c effective_io_concurrency=200

# =============================================================================
# REDIS OPTIMIZATION (If you run Redis in separate container)
# =============================================================================

# Replace Redis command with:
# redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save "" --appendonly no --tcp-keepalive 60 --timeout 300

# =============================================================================
# PERFORMANCE EXPECTATIONS
# =============================================================================

# With these optimizations, you should see:
# 1. 10-50x faster M3U imports when using selective group import
# 2. Better memory management and reduced memory leaks
# 3. Improved web interface responsiveness
# 4. More efficient background task processing

# =============================================================================
# TESTING THE SELECTIVE IMPORT OPTIMIZATION
# =============================================================================

# The selective import feature is already implemented in your code.
# To test it:
# 1. Go to your M3U account with 13,462 channels
# 2. Disable all groups except the one you want to use
# 3. Click "Refresh" on the M3U account
# 4. Check the logs - you should see messages like:
#    "Found 1 active groups for filtering: ['Your Group Name']"
#    "Filtered out 13400+ channels from inactive groups"
#    "Processing 62 channels from 1 active groups"

# =============================================================================
# LOG MONITORING
# =============================================================================

# To monitor the performance improvements:
# docker logs your-dispatcharr-container-name

# Look for these log messages that indicate selective import is working:
# - "Found X active groups for filtering"
# - "Filtered out Y channels from inactive groups"
# - "Processing Z channels from X active groups"

# =============================================================================
# TROUBLESHOOTING
# =============================================================================

# If you don't see performance improvements:
# 1. Ensure only the groups you want are enabled in the M3U account settings
# 2. Check that the selective import logs appear during refresh
# 3. Verify the environment variables are properly set in Unraid
# 4. Restart the container after adding the environment variables

# =============================================================================
# ADDITIONAL NOTES
# =============================================================================

# - The selective import optimization works for both MAC and standard M3U accounts
# - No code changes are required - the optimization is already implemented
# - The performance improvement scales with the ratio of active vs total groups
# - Memory usage will be significantly lower when processing fewer channels