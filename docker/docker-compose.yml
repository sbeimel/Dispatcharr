services:
  web:
    image: ghcr.io/dispatcharr/dispatcharr:latest
    container_name: dispatcharr_web
    ports:
      - 9191:9191
    volumes:
      - ./data:/data
      - tmpfs:/tmp:rw,noexec,nosuid,size=256m
    depends_on:
      - db
      - redis
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=dispatcharr
      - POSTGRES_USER=dispatch
      - POSTGRES_PASSWORD=secret
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DISPATCHARR_LOG_LEVEL=info
      
      # uWSGI Performance Tuning
      - UWSGI_PROCESSES=4              # CPU cores
      - UWSGI_THREADS=2                # Per process
      - UWSGI_BUFFER_SIZE=65536        # 64KB
      - UWSGI_MAX_REQUESTS=1000        # Restart after X requests
      - UWSGI_HARAKIRI=300             # Kill after 5min
      - UWSGI_SINGLE_INTERPRETER=1     # Python optimization
      
      # Process Priority
      - UWSGI_NICE_LEVEL=-5            # High priority for streaming
      - CELERY_NICE_LEVEL=5            # Low priority for background
    
    # Enable high priority for streaming
    cap_add:
      - SYS_NICE
    
    # Memory and CPU limits (increased for better performance)
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '2.0'
        reservations:
          memory: 1.5G
          cpus: '1.0'
    
    # Network optimizations
    sysctls:
      - net.ipv4.tcp_keepalive_time=600
      - net.ipv4.tcp_keepalive_intvl=60
      - net.ipv4.tcp_keepalive_probes=3

  # Fast Celery Worker for M3U/MAC operations
  celery_fast:
    image: ghcr.io/dispatcharr/dispatcharr:latest
    container_name: dispatcharr_celery_fast
    depends_on:
      - db
      - redis
    volumes:
      - ../:/app
      - tmpfs:/tmp:rw,noexec,nosuid,size=512m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=dispatcharr
      - POSTGRES_USER=dispatch
      - POSTGRES_PASSWORD=secret
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DISPATCHARR_LOG_LEVEL=info
    command: >
      bash -c "
      cd /app &&
      nice -n 0 celery -A dispatcharr worker -l info 
      --concurrency=6 
      --prefetch-multiplier=1
      --max-memory-per-child=1000000
      --max-tasks-per-child=100
      -Q m3u_refresh,mac_check,stream_failover,fast
      -O fair
      --without-gossip
      --without-mingle
      -n fast_worker@%h
      "
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '4.0'
        reservations:
          memory: 3G
          cpus: '2.0'

  # Standard Celery Worker for other tasks
  celery_standard:
    image: ghcr.io/dispatcharr/dispatcharr:latest
    container_name: dispatcharr_celery_standard
    depends_on:
      - db
      - redis
    volumes:
      - ../:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=dispatcharr
      - POSTGRES_USER=dispatch
      - POSTGRES_PASSWORD=secret
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DISPATCHARR_LOG_LEVEL=info
    command: >
      bash -c "
      cd /app &&
      nice -n 5 celery -A dispatcharr worker -l info 
      --concurrency=2 
      --prefetch-multiplier=4
      --max-memory-per-child=800000
      --max-tasks-per-child=80
      -Q celery,epg_refresh,cleanup,maintenance,slow
      -n standard_worker@%h
      "
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'

  # Celery Beat Scheduler (separate for reliability)
  celery_beat:
    image: ghcr.io/dispatcharr/dispatcharr:latest
    container_name: dispatcharr_celery_beat
    depends_on:
      - db
      - redis
    volumes:
      - ../:/app
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=dispatcharr
      - POSTGRES_USER=dispatch
      - POSTGRES_PASSWORD=secret
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
    command: >
      bash -c "
      cd /app &&
      nice -n 10 celery -A dispatcharr beat --loglevel=info
      "
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Optimized PostgreSQL
  db:
    image: postgres:14
    container_name: dispatcharr_db
    ports:
      - "5436:5432"
    environment:
      - POSTGRES_DB=dispatcharr
      - POSTGRES_USER=dispatch
      - POSTGRES_PASSWORD=secret
      
      # Memory Settings (adjust based on your RAM)
      - POSTGRES_SHARED_BUFFERS=256MB      # 25% of available RAM
      - POSTGRES_EFFECTIVE_CACHE_SIZE=1GB  # 75% of available RAM
      - POSTGRES_WORK_MEM=16MB             # Per connection
      - POSTGRES_MAINTENANCE_WORK_MEM=64MB
      
      # Connection Settings
      - POSTGRES_MAX_CONNECTIONS=200       # Increased from 100
      
      # Performance Settings
      - POSTGRES_CHECKPOINT_COMPLETION_TARGET=0.9
      - POSTGRES_WAL_BUFFERS=16MB
      - POSTGRES_RANDOM_PAGE_COST=1.1     # Optimized for SSD
      - POSTGRES_EFFECTIVE_IO_CONCURRENCY=200
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf
    
    command: >
      postgres 
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
      -c max_connections=200
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '1.0'

  # Optimized Redis
  redis:
    image: redis:latest
    container_name: dispatcharr_redis
    command: >
      redis-server 
      --maxmemory 1gb 
      --maxmemory-policy allkeys-lru 
      --save ""
      --appendonly no
      --tcp-keepalive 60
      --timeout 300
    sysctls:
      - net.core.somaxconn=65535
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Connection Pooler for PostgreSQL
  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    container_name: dispatcharr_pgbouncer
    ports:
      - "6432:6432"
    environment:
      - DATABASES_HOST=db
      - DATABASES_PORT=5432
      - DATABASES_USER=dispatch
      - DATABASES_PASSWORD=secret
      - DATABASES_DBNAME=dispatcharr
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=200
      - DEFAULT_POOL_SIZE=25
      - SERVER_RESET_QUERY=DISCARD ALL
    depends_on:
      - db

  # Celery Monitoring with Flower
  flower:
    image: mher/flower:latest
    container_name: dispatcharr_flower
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FLOWER_BASIC_AUTH=admin:dispatcharr123
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

volumes:
  postgres_data: